<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Chief</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a; --text: #eef1f6; --muted: #9aa3b2;
    --accent: #5b8cff; --rec: #ff4d5e; --ok: #2fbf71; --warn: #f0b429;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #fff; --line: #dfe3ea; --text: #14171c; --muted: #5d6675; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
  main { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { margin: 0; font-size: 22px; }
  .mode { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .panel h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #talk {
    width: 100%; height: 150px; border-radius: 20px; border: 0; cursor: pointer;
    background: var(--accent); color: #fff; font-size: 22px; font-weight: 600;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #talk.rec { background: var(--rec); animation: pulse 1.1s infinite; }
  #talk:disabled { opacity: .55; cursor: default; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 10px color-mix(in srgb, var(--rec) 25%, transparent); } }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 2px 0; }
  form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 16px;
  }
  button.btn {
    padding: 12px 16px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer;
    background: var(--panel); color: var(--text); font-size: 16px; min-height: 44px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.approve { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
  .said { margin: 0 0 6px; color: var(--muted); font-size: 14px; }
  .said:empty { display: none; }
  #say { margin: 0; font-size: 18px; white-space: pre-wrap; }
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; }
  .card:first-of-type { margin-top: 0; }
  .card .skill { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .card p { margin: 4px 0 8px; white-space: pre-wrap; }
  .card ul { margin: 0 0 10px; padding-left: 18px; color: var(--muted); font-size: 14px; word-break: break-word; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }
  ol#steps { margin: 0; padding-left: 20px; }
  ol#steps li { padding: 2px 0; }
  .empty { color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 14px; }
  .opts label { display: flex; align-items: center; gap: 6px; min-height: 32px; }
  #err { color: var(--warn); font-size: 14px; margin: 0; }
  #err:empty { display: none; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.busy { background: var(--warn); }
  .dot.ok { background: var(--ok); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Chief</h1>
    <span class="mode" id="mode">connecting</span>
  </header>

  <section>
    <button id="talk" type="button">Hold to talk</button>
    <p class="hint" id="talkHint">Hold the button while you speak, or tap once to start and again to stop.</p>
  </section>

  <section class="panel">
    <form id="askForm">
      <input id="text" type="text" autocomplete="off" enterkeyhint="send" placeholder="Or type: how's my week looking?">
      <button class="btn primary" type="submit">Send</button>
    </form>
  </section>

  <section class="panel">
    <h2>Chief says</h2>
    <p class="said" id="heard"></p>
    <p id="say" class="empty">Nothing yet.</p>
  </section>

  <section class="panel">
    <h2>Waiting for you</h2>
    <div id="pending"><span class="empty">No proposals pending.</span></div>
  </section>

  <section class="panel">
    <h2><span class="dot" id="dot"></span>Progress</h2>
    <ol id="steps"><li class="empty">Idle.</li></ol>
  </section>

  <p id="err" role="status"></p>

  <section class="opts">
    <label><input type="checkbox" id="speak" checked> Spoken replies</label>
    <label><input type="checkbox" id="browserSr"> Browser speech recognition (experimental)</label>
    <button class="btn" type="button" id="testVoice">Test voice</button>
  </section>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const TOKEN = new URLSearchParams(location.search).get("token") || "";
  const HEADERS = { "X-Chief-Token": TOKEN };
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const LATCH_MS = 400; // a press shorter than this latches recording on until the next tap

  const talk = $("talk");
  let recorder = null, stream = null, chunks = [], pressedAt = 0, working = false;
  let recognition = null;

  if (!SR) $("browserSr").parentElement.hidden = true;

  function setError(msg) { $("err").textContent = msg || ""; }

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { ...HEADERS, ...(opts.headers || {}) } });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (_) {}
      throw new Error(res.status === 401 ? "Wrong or missing token. Open the link Chief printed." : detail);
    }
    return res.json();
  }

  // ---- speech out -------------------------------------------------------
  function speak(text) {
    if (!text || !$("speak").checked || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = navigator.language || "en-US";
    speechSynthesis.speak(u);
  }
  // Chrome on Android only speaks after a user gesture; a silent utterance on the first press unlocks it.
  let primed = false;
  function primeSpeech() {
    if (primed || !("speechSynthesis" in window)) return;
    primed = true;
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
  }
  $("testVoice").addEventListener("click", () => { primeSpeech(); speak("Hi, I'm Chief. Can you hear me?"); });

  // ---- ask --------------------------------------------------------------
  async function ask(text) {
    text = (text || "").trim();
    if (!text) return;
    setError("");
    $("heard").textContent = "You: " + text;
    setBusy(true);
    try {
      const out = await api("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text }),
      });
      $("say").textContent = out.say;
      $("say").classList.remove("empty");
      speak(out.say);
    } catch (e) {
      setError(e.message);
    } finally {
      setBusy(false);
      poll();
    }
  }

  function setBusy(b) {
    working = b;
    talk.disabled = b;
    if (!recorder) talk.textContent = b ? "Working…" : "Hold to talk";
  }

  $("askForm").addEventListener("submit", (ev) => {
    ev.preventDefault();
    primeSpeech();
    const box = $("text");
    const v = box.value;
    box.value = "";
    ask(v);
  });

  // ---- push to talk -----------------------------------------------------
  function pickMime() {
    if (!window.MediaRecorder) return "";
    for (const m of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"]) {
      if (MediaRecorder.isTypeSupported(m)) return m;
    }
    return "";
  }

  async function startRecording() {
    if ($("browserSr").checked && SR) return startBrowserSr();
    if (!navigator.mediaDevices || !window.MediaRecorder) {
      setError("This page needs HTTPS to use the microphone. Open it through the tunnel link, or type instead.");
      return false;
    }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      setError("Microphone blocked (" + e.name + "). Allow it in the site settings, or type instead.");
      return false;
    }
    const mime = pickMime();
    chunks = [];
    recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = onRecorded;
    recorder.start();
    talk.classList.add("rec");
    talk.textContent = "Listening… release to send";
    return true;
  }

  function stopRecording() {
    if (recognition) { recognition.stop(); return; }
    if (recorder && recorder.state !== "inactive") recorder.stop();
  }

  async function onRecorded() {
    const type = recorder.mimeType || "audio/webm";
    const blob = new Blob(chunks, { type });
    stream.getTracks().forEach((t) => t.stop());
    recorder = null; stream = null;
    talk.classList.remove("rec");
    if (blob.size < 1500) { setBusy(false); setError("Didn't catch that. Hold the button while you speak."); return; }
    setBusy(true);
    talk.textContent = "Transcribing…";
    try {
      const form = new FormData();
      form.append("audio", blob, "speech");
      const { text } = await api("/stt", { method: "POST", body: form });
      if (!text) { setBusy(false); setError("Didn't catch that. Try again."); return; }
      setBusy(false);
      await ask(text);
    } catch (e) {
      setBusy(false);
      setError("Speech-to-text failed: " + e.message + ". You can type instead.");
    }
  }

  function startBrowserSr() {
    recognition = new SR();
    recognition.lang = navigator.language || "en-US";
    recognition.interimResults = false;
    let got = "";
    recognition.onresult = (e) => { got = Array.from(e.results).map((r) => r[0].transcript).join(" "); };
    recognition.onerror = (e) => setError("Browser recognition error: " + e.error + ". Untick it to use the server instead.");
    recognition.onend = () => {
      recognition = null;
      talk.classList.remove("rec");
      talk.textContent = "Hold to talk";
      if (got) ask(got);
    };
    recognition.start();
    talk.classList.add("rec");
    talk.textContent = "Listening… release to send";
    return true;
  }

  const isActive = () => !!(recorder || recognition);

  let held = false;
  function settle() {
    // A quick tap latches recording on until the next tap; a real hold sends on release.
    if (Date.now() - pressedAt < LATCH_MS) talk.textContent = "Listening… tap to send";
    else stopRecording();
  }
  talk.addEventListener("pointerdown", async (ev) => {
    ev.preventDefault();
    if (working) return;
    primeSpeech();
    setError("");
    if (isActive()) { stopRecording(); return; } // a tap while latched stops the recording
    pressedAt = Date.now();
    held = true;
    if (!(await startRecording())) { held = false; return; }
    if (!held) { pressedAt = Date.now(); settle(); } // let go while the mic was still starting: latch
  });
  const release = () => {
    if (!held) return;
    held = false;
    if (isActive()) settle();
  };
  talk.addEventListener("pointerup", release);
  talk.addEventListener("pointercancel", release);
  talk.addEventListener("contextmenu", (e) => e.preventDefault());

  // ---- polling ----------------------------------------------------------
  function renderPending(list) {
    const box = $("pending");
    box.replaceChildren();
    if (!list.length) {
      const s = document.createElement("span");
      s.className = "empty"; s.textContent = "No proposals pending.";
      box.append(s);
      return;
    }
    for (const p of list) {
      const card = document.createElement("div"); card.className = "card";
      const skill = document.createElement("div"); skill.className = "skill"; skill.textContent = p.skill;
      const sum = document.createElement("p"); sum.textContent = p.summary;
      const ul = document.createElement("ul");
      for (const a of p.actions) { const li = document.createElement("li"); li.textContent = a; ul.append(li); }
      const row = document.createElement("div"); row.className = "row";
      const yes = document.createElement("button"); yes.className = "btn approve"; yes.textContent = "Approve";
      const no = document.createElement("button"); no.className = "btn"; no.textContent = "Skip";
      yes.onclick = () => decide(p.id, "approve", [yes, no]);
      no.onclick = () => decide(p.id, "skip", [yes, no]);
      row.append(yes, no);
      card.append(skill, sum, ul);
      if (p.sources.length) {
        const src = document.createElement("div"); src.className = "hint"; src.textContent = "Source: " + p.sources.join(", ");
        card.append(src);
      }
      card.append(row);
      box.append(card);
    }
  }

  async function decide(id, verb, buttons) {
    buttons.forEach((b) => (b.disabled = true));
    primeSpeech();
    setError("");
    try {
      const out = await api("/" + verb + "/" + encodeURIComponent(id), { method: "POST" });
      $("say").textContent = out.say;
      $("say").classList.remove("empty");
      speak(out.say);
    } catch (e) {
      setError(e.message);
    }
    poll();
  }

  function renderSteps(steps, busy) {
    const ol = $("steps");
    ol.replaceChildren();
    if (!steps.length) {
      const li = document.createElement("li"); li.className = "empty"; li.textContent = "Idle.";
      ol.append(li);
    }
    steps.forEach((s, i) => {
      const li = document.createElement("li");
      li.textContent = s;
      if (busy && i === steps.length - 1) li.textContent += "…";
      ol.append(li);
    });
    $("dot").className = "dot " + (busy ? "busy" : steps.length ? "ok" : "");
  }

  let lastPending = "";
  async function poll() {
    try {
      const s = await api("/status");
      $("mode").textContent = s.mode + " mode";
      renderSteps(s.steps, s.busy);
      const sig = JSON.stringify(s.pending);
      if (sig !== lastPending) { lastPending = sig; renderPending(s.pending); }
      if (s.heard && !$("heard").textContent) $("heard").textContent = "You: " + s.heard;
      if (!s.stt) $("talkHint").textContent = "Speech-to-text is not configured on the server (CHIEF_STT_API_KEY). Type instead.";
    } catch (e) {
      $("mode").textContent = "offline";
      if (/token/i.test(e.message)) setError(e.message);
    }
  }
  poll();
  setInterval(poll, 1000);
})();
</script>
</body>
</html>
