[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chief-agent"
version = "0.1.0"
description = "Chief: an open-source personal agent that notices, proposes, and acts only after you approve."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["python-dotenv>=1.0"]

[project.optional-dependencies]
# Real integrations. The mock mode needs none of these.
live = [
  "openai>=1.40",
  "composio>=0.28",  # the composio.sessions API; NOT composio-core
  "parallel-web>=1.3",
  "tzdata; sys_platform == 'win32'",  # only needed for CHIEF_TIMEZONE
  "slack-bolt>=1.18",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.18",  # older releases have known denial-of-service bugs
  "httpx>=0.27",
]
# Just the dashboard, phone page and Telegram: a quick install (no Composio, OpenAI, Slack or Parallel).
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.18", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "python-multipart>=0.0.18"]

[tool.setuptools.packages.find]
include = ["chief*"]

[tool.setuptools.package-data]
"chief.web" = ["index.html", "stage.html", "dashboard.html", "welcome.html", "signin.html", "setup.html", "front.css", "world.js", "pet.js", "icons/*.png", "footage/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
